<title>Wanes · Searching</title>
<style>
  :root{
    --bg:#e9edf2; --frame:#0e1726; --screen:#f5f7fa; --screen-2:#ffffff;
    --ink:#0e1726; --ink-soft:#5b6678; --line:#e2e6ee;
    --teal:#0fae9e; --amber:#ff7a2f; --amber-soft:#fff1e8;
    --street:#d7dde6;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#05090f; --frame:#000; --screen:#0a111d; --screen-2:#111b2b;
      --ink:#e7edf7; --ink-soft:#93a1b8; --line:#20304a;
      --teal:#2ad0bf; --amber:#ff8c4d; --amber-soft:#2a1c12;
      --street:#16233a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#05090f; --frame:#000; --screen:#0a111d; --screen-2:#111b2b;
    --ink:#e7edf7; --ink-soft:#93a1b8; --line:#20304a;
    --teal:#2ad0bf; --amber:#ff8c4d; --amber-soft:#2a1c12; --street:#16233a;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:28px 16px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    font-variant-numeric:tabular-nums;}

  /* phone */
  .phone{width:375px;max-width:100%;aspect-ratio:375/812;background:var(--frame);
    border-radius:44px;padding:11px;box-shadow:0 30px 70px -20px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.04);}
  .screen{position:relative;width:100%;height:100%;background:var(--screen);
    border-radius:34px;overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:var(--frame);border-radius:0 0 16px 16px;z-index:9;}

  /* status bar */
  .statusbar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px 4px;font-size:13px;font-weight:600;z-index:8;}
  .statusbar .ic{display:flex;gap:5px;align-items:center;opacity:.85;}
  .statusbar .ic i{width:16px;height:9px;border-radius:2px;background:currentColor;display:inline-block;}
  .statusbar .ic .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;background:none;position:relative;}
  .statusbar .ic .bat::after{content:"";position:absolute;inset:2px;right:6px;background:currentColor;border-radius:1px;}

  /* radar */
  .radar{position:relative;flex:0 0 54%;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 42%, transparent 55%, color-mix(in srgb,var(--screen) 70%,transparent) 100%),
      var(--screen);}
  .streets{position:absolute;inset:-10%;opacity:.9;}
  .streets span{position:absolute;background:var(--street);border-radius:6px;}
  .s1{width:200%;height:12px;top:30%;left:-50%;transform:rotate(24deg);}
  .s2{width:200%;height:9px;top:62%;left:-50%;transform:rotate(24deg);}
  .s3{width:12px;height:200%;left:34%;top:-50%;transform:rotate(24deg);}
  .s4{width:8px;height:200%;left:66%;top:-50%;transform:rotate(24deg);}
  .s5{width:120px;height:120px;top:12%;left:8%;transform:rotate(24deg);opacity:.5;}
  .s6{width:90px;height:90px;bottom:8%;right:10%;transform:rotate(24deg);opacity:.5;}

  .field{position:absolute;inset:0;display:grid;place-items:center;}
  .center{position:relative;width:0;height:0;}

  .ring{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
    border-radius:50%;border:2px solid var(--amber);
    animation:pulse 2.6s ease-out infinite;opacity:0;}
  .ring:nth-child(2){animation-delay:.65s;}
  .ring:nth-child(3){animation-delay:1.3s;}
  @keyframes pulse{
    0%{transform:scale(.35);opacity:.85;}
    70%{opacity:.18;}
    100%{transform:scale(5.2);opacity:0;}
  }
  .dot-you{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
    border-radius:50%;background:var(--amber);z-index:3;
    box-shadow:0 0 0 5px color-mix(in srgb,var(--amber) 30%,transparent);
    animation:breathe 2.6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--amber) 28%,transparent);}
    50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--amber) 12%,transparent);}}

  .drv{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 22%,transparent);
    animation:blink 3s ease-in-out infinite;}
  .drv::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--teal);opacity:.4;}
  .d1{top:26%;left:30%;animation-delay:.2s;}
  .d2{top:34%;right:22%;animation-delay:1.1s;}
  .d3{bottom:24%;left:26%;animation-delay:.7s;}
  .d4{bottom:30%;right:30%;animation-delay:1.7s;}
  @keyframes blink{0%,100%{opacity:.35;transform:scale(.9);}50%{opacity:1;transform:scale(1);}}

  /* content card */
  .card{flex:1;background:var(--screen-2);border-top:1px solid var(--line);
    border-radius:26px 26px 0 0;margin-top:-22px;position:relative;z-index:4;
    padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;
    box-shadow:0 -14px 30px -20px rgba(0,0,0,.25);}

  .pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    background:var(--amber-soft);color:var(--amber);
    padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.16em;}
  .pill .b{width:7px;height:7px;border-radius:50%;background:var(--amber);
    animation:beat 1.3s ease-in-out infinite;}
  @keyframes beat{0%,100%{opacity:1;}50%{opacity:.3;}}

  h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
  p.sub{margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.55;}

  .chip{display:flex;align-items:center;gap:12px;margin-top:2px;
    background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
    border-radius:14px;padding:13px 15px;}
  .chip .car{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:var(--amber);color:#fff;}
  .chip .car svg{width:17px;height:17px;}
  .chip .txt{font-weight:700;font-size:14.5px;}
  .chip .txt small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em;}
  .chip .time{margin-inline-start:auto;font-size:17px;font-weight:700;color:var(--amber);}

  .cancel{margin-top:auto;width:100%;padding:15px;border-radius:14px;cursor:pointer;
    background:transparent;border:1.5px solid var(--line);color:var(--ink);
    font-size:15px;font-weight:700;font-family:inherit;transition:background .15s,border-color .15s;}
  .cancel:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);}
  .cancel:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .home{width:120px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;
    margin:14px auto 0;}

  @media (prefers-reduced-motion:reduce){
    .ring{animation:none;opacity:.3;transform:scale(2.4);}
    .ring:nth-child(3){transform:scale(4);opacity:.15;}
    .dot-you,.drv,.pill .b{animation:none;}
  }
</style>

<div class="phone">
  <div class="screen">
    <div class="notch"></div>
    <div class="statusbar">
      <span class="mono">9:41</span>
      <span class="ic"><i></i><i style="width:12px"></i><span class="bat"></span></span>
    </div>

    <!-- RADAR -->
    <div class="radar">
      <div class="streets">
        <span class="s1"></span><span class="s2"></span><span class="s3"></span>
        <span class="s4"></span><span class="s5"></span><span class="s6"></span>
      </div>
      <div class="field">
        <div class="center">
          <div class="ring"></div><div class="ring"></div><div class="ring"></div>
          <div class="dot-you"></div>
        </div>
      </div>
      <span class="drv d1"></span><span class="drv d2"></span>
      <span class="drv d3"></span><span class="drv d4"></span>
    </div>

    <!-- CARD -->
    <div class="card">
      <span class="pill mono"><span class="b"></span>LIVE · SEARCHING</span>
      <h1>No trips on this<br>route yet</h1>
      <p class="sub">We're pinging nearby drivers to accept your request — hang tight, this usually takes under a minute.</p>

      <div class="chip">
        <span class="car">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l1.5-4.5A2 2 0 0 1 8.4 6h7.2a2 2 0 0 1 1.9 1.5L19 12v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/></svg>
        </span>
        <span class="txt"><span id="count">3</span> drivers notified<small>Expanding search radius…</small></span>
        <span class="time mono" id="timer">0:18</span>
      </div>

      <button class="cancel" onclick="this.textContent='Cancelling…'">Cancel request</button>
      <div class="home"></div>
    </div>
  </div>
</div>

<script>
  (function(){
    var t=18,timer=document.getElementById('timer'),count=document.getElementById('count'),n=3;
    var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    setInterval(function(){
      if(t>0){t--;var m=Math.floor(t/60),s=t%60;timer.textContent=m+':'+(s<10?'0':'')+s;}
      if(t===0){timer.textContent='0:00';}
    },1000);
    // occasionally bump the notified count to feel live
    if(!reduce){setInterval(function(){ if(t>2 && Math.random()>.5){ n++; count.textContent=n; } },4000);}
  })();
</script>
